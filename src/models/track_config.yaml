track:
    inner_radius: 2.5
    outer_radius: 3.25
    num_segments: 100
    line_radius: 0.0125
    line_height: 0.0025
    seed: 1
    radius_jitter: 1.6
    num_features: 9
    straight_feature_ratio: 0.45
    feature_width_range: [0.25, 0.6]
    angle_warp_strength: 0.35
    angle_warp_harmonics: 3
    high_freq_scale: 0.3
    num_chicanes: 3
    chicane_spacing: [0.08, 0.16]
    oval_ratio: 1.4
    oval_rotation: 0.0

camera:
    resolution:
        width: 960
        height: 720
    fov: 90
    near_plane: 0.025
    far_plane: 25.0
    position_offset:
        x: 0.125
        y: 0.0
        z: 0.15
    pitch: -50
    bird_eye_transform:
        # Inverse perspective mapping parameters
        # Pixels per meter in bird's-eye view
        pixels_per_meter: 100.0        # Scale for bird's-eye output


physics:
    time_step: 0.03333333333333333
    gravity: -9.81  # Enable gravity for realistic physics
    car:
        max_linear_velocity: 2.0   # m/s forward/backward
        max_angular_velocity: 3.5  # rad/s yaw rotation (increased for faster, smoother turning)

spawn:
    position: [0.0, 2.75, 0.0675]
    orientation: [0, 0, 0, 1]

# Random friction obstacles (COMMENTED OUT - using track-wide surface instead)
# friction_obstacles:
#     enabled: true
#     count: 60  # Increased count for better coverage
#     size_range: [0.25, 0.35]  # Size in meters [min, max]
#     height: 0.01  # Height of obstacle (thin patches)
#     placement: aligned  # Options: aligned, random, centerline, sides

# Track-wide friction surface that fills the entire track area
track_friction_surface:
    enabled: true
    friction_coefficient: 0.8  # Friction coefficient (0.0 = ice, 1.0 = high friction)
    height: 0.001  # Thickness of the surface in meters (very thin to avoid catching car)
    color: [0.3, 0.3, 0.3, 1.0]  # Gray color (RGBA)

hill_obstacles:
    enabled: true
    count: 6
    type: mound  # Options: ramp, bump, mound
    size_range: [0.5, 1.5]  # Size in meters [min, max]
    height_range: [0.15, 0.25]  # Height in meters [min, max]
    color: [0.5, 0.4, 0.3, 1.0]  # Brown/tan color (RGBA)
    placement: random  # Options: random, centerline, sides

autonomous:
    enabled: false  # Set to true to start in auto mode
    target_speed: 1.5  # Constant speed in m/s
    steering_pid:
        kp: 0.01  # Proportional gain
        ki: 0.0   # Integral gain
        kd: 0.005 # Derivative gain
    centerline_row: 0.6  # Fraction of image height to sample centerline (0.0-1.0)
